name: Verify Multi-Head Video RAG Router

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Train model and smoke-test CLI
        run: |
          python -m src.train
          python -m src.main --query "What color was the car at 00:15?"
          python src/main.py --query "Summarize the full plot of this video."
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
