name: Validate Intent Router

on:
  push:
    branches: [main, improvement/production-quality, experiments/ml-quality-evaluation]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: intent-router-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Train deterministic development artifact
        run: python -m src.main train
      - name: Smoke-test CLI
        run: |
          python -m src.main predict --query "What color is the car at 00:15?"
          python -m src.main predict --query "What does the speaker say at 02:30?"
          python -m src.main predict --query "Summarize the entire video."
      - name: Run unit and API tests
        run: python -m unittest discover -s tests -v
      - name: Validate bundled JSONL schema and benchmark metric semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          from src.benchmark import load_labelled_rows, evaluate
          from src.intent_classifier import VideoRAGIntentClassifier
          from src.train import EXPANDED_CORPUS
          rows = load_labelled_rows(Path("data/intent_eval.jsonl"))
          assert len(rows) >= 6
          model = VideoRAGIntentClassifier()
          model.fit(
              [row[0] for row in EXPANDED_CORPUS],
              [row[1] for row in EXPANDED_CORPUS],
              [row[2] for row in EXPANDED_CORPUS],
          )
          report = evaluate(model, rows)
          assert "scope_top1" in report and "scope_candidate_recall" in report
          assert "reasoning_tier" in report and "multi_route_coverage" in report
          print("Evaluation schema and metric contracts are valid.")
          PY
      - name: Smoke-test ActivityNet-QA preparation and grouped model comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.prepare_activitynet import map_labels
          from scripts.compare_models import load, build_models
          sample = [json.loads(line) for line in Path("data/external/activitynet_qa_questions_sample.jsonl").read_text().splitlines() if line.strip()]
          assert len(sample) >= 500
          labels = [map_labels(row["query"]) for row in sample]
          assert {scope for scope, _ in labels} <= {"FRAME", "CLIP", "WHOLE_VIDEO"}
          assert {tier for _, tier in labels} <= {"L1_DIRECT", "L2_RETRIEVAL", "L3_GRAPH"}
          assert len(build_models()) == 5
          print(f"ActivityNet-QA sample smoke test passed: {len(sample)} questions; five model configurations.")
          PY
      - name: Build Docker image
        run: docker build --pull -t video-intent-router:ci .
      - name: Run container and test service
        run: |
          set -euo pipefail
          docker run -d --name intent-router -p 8000:8000 video-intent-router:ci
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Container did not become healthy."
            docker logs intent-router
            exit 1
          fi
          for endpoint in route classify; do
            curl --fail --silent --show-error \
              -X POST "http://localhost:8000/$endpoint" \
              -H 'Content-Type: application/json' \
              -d '{"query":"What color was the car at 00:15?"}' \
              | python -c 'import json,sys; p=json.load(sys.stdin); assert p["assigned_scopes"]; assert p["reasoning_tier"]; assert "confidence_distribution" in p'
          done
      - name: Collect container logs on failure
        if: failure()
        run: docker logs intent-router || true
      - name: Stop container
        if: always()
        run: docker rm -f intent-router || true
