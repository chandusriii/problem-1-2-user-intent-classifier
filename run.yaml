setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python src/main.py --query \"What color is the car at 00:15?\""
  - "python src/benchmark.py --labels data/intent_eval.jsonl --output results/benchmark.json"

test_commands:
  - "python -m unittest discover -s tests -v"

notes: "CPU-only; no model-weight downloads. The bundled JSONL is a smoke set, not official VideoMME benchmark results. See docs/INTENT_CLASSIFIER_DESIGN.md for the required VideoMME scope-annotation/evaluation plan."
