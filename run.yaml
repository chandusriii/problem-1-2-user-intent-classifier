setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  - "python src/main.py --query \"What color is the car at 00:15?\""
  - "python src/main.py --query \"What does the speaker say at 02:30?\""
  - "python src/main.py --query \"Summarize the entire video.\""

test_commands:
  - "python -m unittest discover -s tests -v"

notes: "CPU-only rules baseline. Scope (FRAME/CLIP/WHOLE_VIDEO) is independent of reasoning tier (L1_DIRECT/L2_RETRIEVAL/L3_GRAPH). Empty queries are rejected; bundled checks are smoke tests, not official VideoMME accuracy."
