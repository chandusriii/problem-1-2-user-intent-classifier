setup_commands:
  - "python -m pip install -r requirements.txt"

run_commands:
  - "python -m src.main train"
  - "python -m src.main predict --query \"What color was the car at 00:15?\""
  - "python -m src.main predict --query \"Summarize the full plot of this video?\""

test_commands:
  - "python -m unittest discover -s tests -v"

notes: "The bundled, manually authored examples are a development smoke-test corpus. They are not official Video-MME labels or a held-out benchmark. Do not claim generalization accuracy or target latency without independent evaluation."
